    <rect x="120" y="148" width="38" height="88" rx="7" fill="url(#teal)"/>
    <rect x="170" y="148" width="32" height="88" rx="7" fill="#2563eb"/>
    <rect x="214" y="148" width="48" height="88" rx="7" fill="url(#orange)"/>
    <rect x="274" y="148" width="30" height="88" rx="7" fill="#facc15"/>
    <rect x="318" y="148" width="44" height="88" rx="7" fill="#7c3aed"/>
